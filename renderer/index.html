<div id="tabbar">
  <img class="tlogo" src="brand/symbol-64.png" alt="Awraq PDF" title="Awraq PDF">
  <div id="tabs" role="tablist"></div>
  <button id="bNewTab" title="Open file (Ctrl+O)"><svg class="i"><use href="#i-add"/></svg></button>
</div>

<header id="toolbar">
  <div class="tbg">
    <button id="bSide" title="Sidebar (F4)" aria-pressed="true" data-need><svg class="i"><use href="#i-side"/></svg></button>
    <span class="sep"></span>
    <button id="bOpen" title="Open (Ctrl+O)"><svg class="i"><use href="#i-open"/></svg></button>
    <button id="bSave" title="Save (Ctrl+S)" data-need><svg class="i"><use href="#i-save"/></svg></button>
    <button id="bPrint" class="opt2" title="Print (Ctrl+P)" data-need><svg class="i"><use href="#i-print"/></svg></button>
    <span class="sep"></span>
    <button id="bUndo" title="Undo (Ctrl+Z)" data-need><svg class="i"><use href="#i-undo"/></svg></button>
    <button id="bRedo" title="Redo (Ctrl+Y)" data-need><svg class="i"><use href="#i-redo"/></svg></button>
  </div>
  <button id="bCmd" class="cmdbtn" title="Find a command (Ctrl+K)"><svg class="i"><use href="#i-search"/></svg><span class="lbl" data-t>Find a command or a page…</span><kbd dir="ltr">Ctrl+K</kbd></button>
  <div class="tbg end">
    <button id="bSearch" title="Find in document (Ctrl+F)" aria-pressed="false" data-need><svg class="i"><use href="#i-search"/></svg><span class="lbl opt1" data-t>Find</span></button>
    <button id="bTools" class="modebtn" title="Comment, edit text, sign and redact" aria-pressed="false" data-need><svg class="i"><use href="#i-pen"/></svg><span class="lbl" data-t>Edit and sign</span></button>
    <span class="sep opt1"></span>
    <button id="bFocus" class="opt1" title="Focus mode (F9)" aria-pressed="false" data-need><svg class="i"><use href="#i-focus"/></svg></button>
    <button id="bNight" class="opt1" title="Night reading (Ctrl+I)" aria-pressed="false" data-need><svg class="i"><use href="#i-moon"/></svg></button>
    <button id="bSpeak" class="opt2" title="Read aloud" aria-pressed="false" data-need><svg class="i"><use href="#i-speak"/></svg></button>
    <button id="bPresent" class="opt2" title="Presentation mode (F5)" data-need><svg class="i"><use href="#i-play"/></svg></button>
    <button id="bFull" class="opt2" title="Full screen (F11)"><svg class="i"><use href="#i-full"/></svg></button>
    <span class="sep"></span>
    <button id="bSettings" title="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    <button id="bMenu" title="All tools and options" aria-haspopup="true"><svg class="i"><use href="#i-menu"/></svg></button>
  </div>
</header>

<div id="toolsbar" class="subbar" role="toolbar" aria-label="Editing tools" data-tool="select">
  <div class="tgroup" id="toolBtns">
    <button data-tool="select" title="Select text (V)" aria-pressed="true"><svg class="i"><use href="#i-cursor"/></svg></button>
    <button data-tool="hand" title="Hand tool (H)"><svg class="i"><use href="#i-hand"/></svg></button>
    <button data-tool="edit" title="Move, resize and delete comments (E)"><svg class="i"><use href="#i-edit"/></svg></button>
    <span class="sep"></span>
    <button data-tool="retype" class="feature" title="Edit text: click a line to replace its words (R)"><svg class="i"><use href="#i-retype"/></svg><span class="lbl" data-t>Edit text</span></button>
    <span class="sep"></span>
    <button data-tool="highlight" title="Highlight text"><svg class="i"><use href="#i-hl"/></svg></button>
    <button data-tool="underline" title="Underline text"><svg class="i"><use href="#i-ul"/></svg></button>
    <button data-tool="strike" title="Strike out text"><svg class="i"><use href="#i-st"/></svg></button>
    <span class="sep"></span>
    <button data-tool="ink" title="Pen (P)"><svg class="i"><use href="#i-pen"/></svg></button>
    <button data-tool="marker" title="Freehand highlighter"><svg class="i"><use href="#i-hl"/></svg><small>~</small></button>
    <button data-tool="rect" title="Rectangle"><svg class="i"><use href="#i-rect"/></svg></button>
    <button data-tool="ellipse" title="Ellipse"><svg class="i"><use href="#i-ell"/></svg></button>
    <button data-tool="line" title="Line"><svg class="i"><use href="#i-line"/></svg></button>
    <button data-tool="arrow" title="Arrow"><svg class="i"><use href="#i-arrow"/></svg></button>
    <span class="sep"></span>
    <button data-tool="text" title="Text box (T)"><svg class="i"><use href="#i-text"/></svg></button>
    <button data-tool="note" title="Sticky note (N)"><svg class="i"><use href="#i-note"/></svg></button>
    <button data-tool="stamp" title="Stamp"><svg class="i"><use href="#i-stamp"/></svg></button>
    <button data-tool="sign" title="Signature"><svg class="i"><use href="#i-sign"/></svg></button>
    <button data-tool="image" title="Insert image"><svg class="i"><use href="#i-img"/></svg></button>
    <span class="sep"></span>
    <button data-tool="redact" title="Mark for redaction"><svg class="i"><use href="#i-redact"/></svg></button>
    <button id="bApplyRedact" class="danger" title="Apply redactions"><span data-t>Apply redactions</span></button>
  </div>
  <span class="sep pre"></span>
  <div class="tprops">
    <div class="tgroup" id="swatches"></div>
    <input type="color" id="colorPick" title="Custom color">
    <label class="mini p-width"><span data-t>Width</span> <input type="range" id="widthIn" min="1" max="16" value="3"></label>
    <label class="mini p-font"><span data-t>Font</span> <select id="fontSize"><option>10</option><option selected>14</option><option>18</option><option>24</option><option>32</option><option>48</option></select></label>
    <label class="mini p-fill"><input type="checkbox" id="fillIn"> <span data-t>Fill</span></label>
  </div>
  <span id="toolHint"></span>
</div>

<div id="banner" hidden><svg class="i"><use href="#i-info"/></svg><span id="bannerMsg"></span><span class="grow"></span><span id="bannerBtns"></span></div>

<main>
  <aside id="side">
    <div class="sidetabs" role="tablist">
      <button data-panel="thumbs" aria-selected="true" title="Pages"><svg class="i"><use href="#i-pages"/></svg></button>
      <button data-panel="outline" title="Outline"><svg class="i"><use href="#i-menu"/></svg></button>
      <button data-panel="bookmarks" title="Bookmarks"><svg class="i"><use href="#i-bm"/></svg></button>
      <button data-panel="annots" title="Comments"><svg class="i"><use href="#i-note"/></svg></button>
      <button data-panel="notes" title="My notes"><svg class="i"><use href="#i-notes"/></svg></button>
      <button data-panel="attach" title="Attachments"><svg class="i"><use href="#i-clip"/></svg></button>
      <button data-panel="results" title="Search results"><svg class="i"><use href="#i-search"/></svg></button>
      <button data-panel="compare" title="Compare"><svg class="i"><use href="#i-compare"/></svg></button>
    </div>
    <div class="panel" id="p-thumbs"></div>
    <div class="panel" id="p-outline" hidden></div>
    <div class="panel" id="p-bookmarks" hidden></div>
    <div class="panel" id="p-annots" hidden></div>
    <div class="panel" id="p-notes" hidden></div>
    <div class="panel" id="p-attach" hidden></div>
    <div class="panel" id="p-results" hidden></div>
    <div class="panel" id="p-compare" hidden></div>
  </aside>
  <section id="stage">
    <div id="searchbar" class="subbar" role="search">
      <div class="qrow">
        <svg class="i qicon"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Find in document…" aria-label="Find">
        <span id="qinfo"></span>
        <button id="qPrev" title="Previous (Shift+F3)"><svg class="i"><use href="#i-up"/></svg></button>
        <button id="qNext" title="Next (F3)"><svg class="i"><use href="#i-down"/></svg></button>
        <button id="qClose" title="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="qrow qopts">
        <label class="chip" title="Highlight all"><input type="checkbox" id="qAll" checked><span data-t>Highlight all</span></label>
        <label class="chip" title="Match case"><input type="checkbox" id="qCase"><span>Aa</span></label>
        <label class="chip" title="Whole words"><input type="checkbox" id="qWord"><span class="ww">ab</span></label>
        <label class="chip" title="Match diacritics"><input type="checkbox" id="qDia"><span>á</span></label>
        <span class="grow"></span>
        <button id="qList" title="List every result in the sidebar"><svg class="i"><use href="#i-menu"/></svg><span data-t>List all</span></button>
        <button id="qRedact" title="Mark every match for redaction"><svg class="i"><use href="#i-redact"/></svg><span data-t>Redact matches</span></button>
      </div>
    </div>
    <div id="hud" role="toolbar" aria-label="Page and zoom">
      <button id="bPrev" title="Previous page" data-need><svg class="i"><use href="#i-up"/></svg></button>
      <div class="pg"><input id="pageInput" aria-label="Page number" data-need><span id="pageCount">/ 0</span></div>
      <button id="bNext" title="Next page" data-need><svg class="i"><use href="#i-down"/></svg></button>
      <span class="sep"></span>
      <button id="bZoomOut" title="Zoom out (Ctrl -)" data-need><svg class="i"><use href="#i-minus"/></svg></button>
      <select id="zoomSel" data-need aria-label="Zoom">
        <option value="auto" data-t>Automatic</option><option value="page-width" data-t>Fit width</option><option value="page-fit" data-t>Fit page</option><option value="page-actual" data-t>Actual size</option>
        <option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option>
        <option value="custom" hidden>-</option>
      </select>
      <button id="bZoomIn" title="Zoom in (Ctrl +)" data-need><svg class="i"><use href="#i-plus"/></svg></button>
      <span class="sep"></span>
      <button id="bRotL" title="Rotate left (Ctrl+L)" data-need><svg class="i"><use href="#i-rotl"/></svg></button>
      <button id="bRotR" title="Rotate right (Ctrl+R)" data-need><svg class="i"><use href="#i-rotr"/></svg></button>
      <button id="bLayout" title="Page layout" aria-haspopup="true" data-need><svg class="i"><use href="#i-layout"/></svg></button>
    </div>
    <div id="layoutPop" class="popup" hidden>
      <label class="plabel" for="scrollSel" data-t>Page layout</label>
      <select id="scrollSel" data-need aria-label="Page layout" title="Page layout">
        <option value="0" data-t>Continuous</option><option value="3" data-t>Single page</option><option value="1" data-t>Horizontal</option><option value="2" data-t>Grid</option>
      </select>
      <label class="plabel" for="spreadSel" data-t>Spreads</label>
      <select id="spreadSel" data-need aria-label="Spreads" title="Spreads">
        <option value="0" data-t>No spreads</option><option value="1" data-t>Odd spreads</option><option value="2" data-t>Even spreads</option>
      </select>
    </div>
    <button id="bFocusExit" title="Leave focus mode (F9)"><svg class="i"><use href="#i-shrink"/></svg><span data-t>Leave focus mode</span></button>
    <div id="welcome">
      <div class="wwrap">
        <header class="whead">
          <img class="wlogo" src="brand/symbol.png" alt="">
          <div>
            <h1 class="wordmark" dir="ltr"><span>Awraq</span><span class="pdf">PDF</span></h1>
            <p class="tagline" data-t>Open Source PDF Reader &amp; Editor</p>
          </div>
        </header>
        <div class="wstart">
          <button class="wdrop" id="bOpen2">
            <span class="wdicon"><svg class="i"><use href="#i-drop"/></svg></span>
            <span class="wdt" data-t>Open file</span>
            <span class="wdd" data-t>Open a file or drop it here.</span>
          </button>
          <div class="wacts">
            <button class="wact" id="bCombine2"><svg class="i"><use href="#i-combine"/></svg><span class="wat" data-t>Combine PDFs</span><span class="wad" data-t>Join several files into one, in the order you choose.</span></button>
            <button class="wact" id="bImages2"><svg class="i"><use href="#i-img"/></svg><span class="wat" data-t>Images to PDF</span><span class="wad" data-t>Turn photos and scans into a single PDF.</span></button>
            <button class="wact" id="bCompare2"><svg class="i"><use href="#i-compare"/></svg><span class="wat" data-t>Compare two PDFs</span><span class="wad" data-t>See which words changed between two versions.</span></button>
          </div>
        </div>
        <section id="continueBox" hidden></section>
        <section id="recentBox" hidden>
          <div class="rtop"><h2 data-t>Recent files</h2><input id="recentQ" type="search" placeholder="Filter recent files" aria-label="Filter recent files" hidden></div>
          <ul id="recentList"></ul>
        </section>
        <p class="wtip" id="wtip"></p>
      </div>
    </div>
  </section>
</main>

<footer id="status"><span id="stLeft"></span><span class="grow"></span><span id="stRight"></span></footer>

  <div class="mcol">
    <div class="mhead" data-t>File</div>
    <button data-act="open"><svg class="i"><use href="#i-open"/></svg><span data-t>Open…</span><kbd>Ctrl+O</kbd></button>
    <button data-act="newwin"><svg class="i"><use href="#i-window"/></svg><span data-t>New window</span><kbd>Ctrl+N</kbd></button>
    <button data-act="save" data-need><svg class="i"><use href="#i-save"/></svg><span data-t>Save</span><kbd>Ctrl+S</kbd></button>
    <button data-act="saveas" data-need><svg class="i"><use href="#i-save"/></svg><span data-t>Save as…</span><kbd>Ctrl+Shift+S</kbd></button>
    <button data-act="flatten" data-need><svg class="i"><use href="#i-flat"/></svg><span data-t>Save flattened copy…</span></button>
    <button data-act="print" data-need><svg class="i"><use href="#i-print"/></svg><span data-t>Print…</span><kbd>Ctrl+P</kbd></button>
    <button data-act="folder" data-need><svg class="i"><use href="#i-folder"/></svg><span data-t>Show in folder</span></button>
    <button data-act="props" data-need><svg class="i"><use href="#i-info"/></svg><span data-t>Document properties</span><kbd>Ctrl+D</kbd></button>
    <button data-act="editprops" data-need><svg class="i"><use href="#i-edit"/></svg><span data-t>Edit document properties…</span></button>
    <div class="mhead" data-t>Create and export</div>
    <button data-act="combine"><svg class="i"><use href="#i-combine"/></svg><span data-t>Combine files into one PDF…</span></button>
    <button data-act="images"><svg class="i"><use href="#i-img"/></svg><span data-t>Create PDF from images…</span></button>
    <button data-act="png" data-need><svg class="i"><use href="#i-img"/></svg><span data-t>Export page as PNG…</span></button>
    <button data-act="txt" data-need><svg class="i"><use href="#i-file"/></svg><span data-t>Export text as TXT…</span></button>
    <button data-act="annotsummary" data-need><svg class="i"><use href="#i-export"/></svg><span data-t>Export comment summary…</span></button>
    <button data-act="copytext" data-need><svg class="i"><use href="#i-file"/></svg><span data-t>Copy page text</span></button>
  </div>
  <div class="mcol">
    <div class="mhead" data-t>Pages</div>
    <button data-act="merge" data-need><svg class="i"><use href="#i-add"/></svg><span data-t>Merge another PDF…</span></button>
    <button data-act="insertimg" data-need><svg class="i"><use href="#i-img"/></svg><span data-t>Insert images as pages…</span></button>
    <button data-act="blank" data-need><svg class="i"><use href="#i-add"/></svg><span data-t>Insert blank page after current</span></button>
    <button data-act="duplicate" data-need><svg class="i"><use href="#i-dup"/></svg><span data-t>Duplicate current page</span></button>
    <button data-act="extract" data-need><svg class="i"><use href="#i-export"/></svg><span data-t>Extract pages…</span></button>
    <button data-act="split" data-need><svg class="i"><use href="#i-split"/></svg><span data-t>Split document…</span></button>
    <button data-act="rotpage" data-need><svg class="i"><use href="#i-rotr"/></svg><span data-t>Rotate current page only</span></button>
    <button data-act="delpage" data-need><svg class="i"><use href="#i-trash"/></svg><span data-t>Delete current page</span></button>
    <button data-act="pagenums" data-need><svg class="i"><use href="#i-hash"/></svg><span data-t>Add page numbers…</span></button>
    <button data-act="watermark" data-need><svg class="i"><use href="#i-stamp"/></svg><span data-t>Add watermark…</span></button>
    <div class="mhead" data-t>Protect and review</div>
    <button data-act="compare" data-need><svg class="i"><use href="#i-compare"/></svg><span data-t>Compare with another PDF…</span></button>
    <button data-act="ocr" data-need><svg class="i"><use href="#i-scan"/></svg><span data-t>Recognize text (OCR)…</span></button>
    <button data-act="protect" data-need><svg class="i"><use href="#i-lock"/></svg><span data-t>Password protection…</span></button>
    <button data-act="redact" data-need><svg class="i"><use href="#i-redact"/></svg><span data-t>Apply redactions…</span></button>
    <button data-act="compress" data-need><svg class="i"><use href="#i-shrink"/></svg><span data-t>Reduce file size…</span></button>
  </div>
  <div class="mcol">

    <button data-act="focus" data-need class="chk"><svg class="i"><use href="#i-focus"/></svg><span data-t>Focus mode</span><kbd>F9</kbd></button>
    <button data-act="night" data-need class="chk"><svg class="i"><use href="#i-moon"/></svg><span data-t>Night reading</span><kbd>Ctrl+I</kbd></button>
    <button data-act="sepia" data-need class="chk"><svg class="i"><use href="#i-sepia"/></svg><span data-t>Sepia pages</span></button>

    <button data-act="speak" data-need class="chk"><svg class="i"><use href="#i-speak"/></svg><span data-t>Read aloud</span></button>
    <button data-act="full"><svg class="i"><use href="#i-full"/></svg><span data-t>Full screen</span><kbd>F11</kbd></button>
    <button data-act="bookmark" data-need><svg class="i"><use href="#i-bm"/></svg><span data-t>Add bookmark</span><kbd>Ctrl+B</kbd></button>
    <button data-act="goto" data-need><svg class="i"><use href="#i-pages"/></svg><span data-t>Go to page…</span><kbd>Ctrl+G</kbd></button>
    <div class="mhead" data-t>Awraq PDF</div>
    <button data-act="palette"><svg class="i"><use href="#i-cmd"/></svg><span data-t>Find a command…</span><kbd>Ctrl+K</kbd></button>
    <button data-act="settings"><svg class="i"><use href="#i-gear"/></svg><span data-t>Settings and language…</span></button>
    <button data-act="keys"><svg class="i"><use href="#i-kbd"/></svg><span data-t>Keyboard shortcuts</span><kbd>?</kbd></button>
