# Builds the Windows installer + portable exe and publishes them as a GitHub Release.
# Run it from the browser: Actions tab → "Release" → "Run workflow".
# The release number comes from "version" in package.json.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
